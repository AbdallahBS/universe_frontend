[build]
  publish = "dist"
  command = "npm run build"

# ── Serve exam-certificates with its own HTML (for OG meta tags) ──────────────
# This MUST come BEFORE the SPA catch-all so Netlify doesn't intercept it first.
[[redirects]]
  from = "/exam-certificates"
  to = "/exam-certificates/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/exam-certificates/"
  to = "/exam-certificates/index.html"
  status = 200
  force = true

# ── SPA catch-all (all other routes serve main index.html) ───────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Disable partial-content (206) responses for HTML pages.
# Facebook's scraper needs a full 200 response to read OG meta tags.
[[headers]]
  for = "/*.html"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.png"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=86400"
